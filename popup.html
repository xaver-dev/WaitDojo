<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WaitWords</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; }

  /* ---- Theme-Variablen (default). Presets überschreiben per body[data-theme]. ---- */
  :root {
    --card: #1c1f26;
    --frame: #3a3f4b;
    --accent: #f0c674;
    --accent-ink: #1c1f26;   /* Text auf Accent-Flächen */
    --text: #e8e6e3;
    --muted: #8a8f9c;
    --row: #242833;
    --row-border: #333846;
    --field: #1a1d24;
  }
  body[data-theme="chinese"] { --accent: #e0b64a; --frame: #8a2a2a; }
  body[data-theme="nature"]  { --accent: #8fbf6f; --frame: #3f5a3f; }
  body[data-theme="medical"] { --accent: #6fb7d6; --frame: #2f5a6a; }
  body[data-theme="minimal"] { --accent: #cfd3da; --frame: #3a3f4b; }

  body {
    font-family: "Segoe UI", sans-serif;
    color: var(--text);
    padding: 8px;
    user-select: none;
  }
  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--frame);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
    display: flex;
    flex-direction: column;
    gap: 10px;
    height: calc(100vh - 16px);
    -webkit-app-region: drag;
  }
  /* Dekorativer Doppelrahmen für „chinese" (rein CSS, kein Bild) */
  body[data-theme="chinese"] .card {
    border-width: 2px;
    box-shadow: 0 8px 32px rgba(0,0,0,.5), inset 0 0 0 1px rgba(224,182,74,.30);
  }
  body[data-theme="chinese"] .card::before {
    content: "";
    position: absolute; inset: 6px;
    border: 1px solid rgba(224,182,74,.40);
    border-radius: 10px;
    pointer-events: none;
  }
  header { display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 15px; font-weight: 600; color: var(--accent); }
  header .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  #closeBtn, #menuBtn {
    -webkit-app-region: no-drag;
    background: none; border: none; color: var(--muted);
    font-size: 18px; cursor: pointer; padding: 2px 8px; border-radius: 8px;
  }
  #menuBtn { font-size: 14px; }
  #closeBtn:hover, #menuBtn:hover { background: #2a2e38; color: #fff; }
  #rows { display: flex; flex-direction: column; gap: 8px; flex: 1; -webkit-app-region: no-drag; overflow-y: auto; min-height: 0; }
  #rows::-webkit-scrollbar { width: 6px; }
  #rows::-webkit-scrollbar-thumb { background: var(--frame); border-radius: 3px; }
  .row {
    background: var(--row);
    border: 1px solid var(--row-border);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .row .top { display: flex; align-items: baseline; justify-content: space-between; }
  .row .front { font-size: 17px; font-weight: 600; letter-spacing: .3px; }
  .row .hint { font-size: 11px; font-weight: 400; color: var(--muted); }
  .row .badge {
    font-size: 9px; text-transform: uppercase; letter-spacing: .5px;
    padding: 2px 6px; border-radius: 6px; background: var(--row-border); color: #9aa0ae;
  }
  .badge.problem { background: #4a2530; color: #ff9caa; }
  .badge.new { background: #23394a; color: #8ec9ff; }
  .badge.good { background: #24402c; color: #96d9a4; }
  .row input {
    width: 100%; margin-top: 6px;
    background: var(--field); border: 1px solid var(--frame); border-radius: 7px;
    color: var(--text); font-size: 13px; padding: 6px 8px; outline: none;
  }
  .row input:focus { border-color: var(--accent); }
  .row.correct { border-color: #3f7a4d; }
  .row.correct input { border-color: #3f7a4d; color: #96d9a4; }
  .row.wrong { border-color: #8a3a49; }
  .row.wrong input { border-color: #8a3a49; color: #ff9caa; }
  .row.skipped { opacity: .75; }
  .solution { font-size: 12px; color: #b8bdc9; margin-top: 5px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .solution b { color: var(--accent); font-weight: 600; }
  .override {
    background: none; border: 1px solid #3f7a4d; color: #96d9a4;
    border-radius: 6px; font-size: 10px; padding: 2px 7px; cursor: pointer; white-space: nowrap;
  }
  .override:hover { background: #24402c; }
  #limitNote { font-size: 11px; color: var(--accent); text-align: center; }

  #statusBar {
    -webkit-app-region: no-drag;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 11px; color: var(--muted);
  }
  #usageChip { white-space: nowrap; }
  #usageChip b { color: var(--text); }
  #deckPills { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .pill {
    background: var(--row); border: 1px solid var(--row-border); color: var(--muted);
    border-radius: 999px; padding: 3px 9px; font-size: 11px; cursor: pointer; white-space: nowrap;
    max-width: 130px; overflow: hidden; text-overflow: ellipsis;
  }
  .pill:hover { border-color: var(--accent); color: var(--text); }
  .pill.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); cursor: default; }

  footer { display: flex; gap: 8px; align-items: center; -webkit-app-region: no-drag; }
  #mainBtn {
    flex: 1;
    background: var(--accent); color: var(--accent-ink); border: none;
    border-radius: 10px; padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #mainBtn:hover { filter: brightness(1.08); }
  #summary { font-size: 12px; color: var(--muted); white-space: nowrap; }
</style>
</head>
<body>
  <div class="card">
    <header>
      <div>
        <h1 id="title"></h1>
        <div class="sub" id="instruction"></div>
      </div>
      <div>
        <button id="menuBtn" title="Decks &amp; settings">⚙</button><button id="closeBtn" title="Close (Esc)">✕</button>
      </div>
    </header>
    <div id="rows"></div>
    <div id="limitNote" hidden>Last free popup for this deck today — resets at midnight</div>
    <div id="statusBar">
      <span id="usageChip"></span>
      <div id="deckPills"></div>
    </div>
    <footer>
      <span id="summary"></span>
      <button id="mainBtn"></button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
